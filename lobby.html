<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusMeet | Conference Pre-Meeting Lobby</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <style>
    .lobby-container {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
    }

    .lobby-main-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .lobby-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 2rem;
      max-width: 960px;
      width: 100%;
      align-items: center;
    }

    /* Device Preview Tile */
    .device-preview-card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-elevation-2);
    }

    .preview-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .preview-placeholder {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #18181c 0%, #0d0d10 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .preview-placeholder.hidden {
      display: none !important;
    }

    .preview-controls-overlay {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(18, 18, 21, 0.9);
      backdrop-filter: blur(12px);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-active);
      z-index: 10;
    }

    /* Action Panel */
    .lobby-action-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: var(--shadow-elevation-1);
    }

    .user-profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .user-profile-meta {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .btn-join-room {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent-signal);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition-tactile);
    }

    .btn-join-room:hover {
      background: var(--accent-signal-hover);
    }

    .btn-join-room:active {
      transform: translateY(1px);
    }

    .quick-actions-row {
      display: flex;
      gap: 0.5rem;
    }

    .btn-quick-create {
      flex: 1;
      padding: 0.5rem;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: var(--transition-tactile);
    }

    .btn-quick-create:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-active);
    }

    @media (max-width: 768px) {
      .lobby-grid {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="lobby-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo"><i class="fa-solid fa-cube"></i></div>
        <span class="brand-title">NexusMeet</span>
        <div class="room-info-badge">
          <span class="status-dot"></span>
          <span>Pre-Meeting Lobby</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-logout" class="btn-secondary" title="Sign Out">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>Logout</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="lobby-main-stage">
      <div class="lobby-grid">
        
        <!-- Left: Device Preview Stage -->
        <div class="device-preview-card">
          <video id="preview-video-stream" class="preview-video" autoplay playsinline muted></video>
          
          <div id="preview-avatar-placeholder" class="preview-placeholder hidden">
            <div class="user-avatar-circle" id="preview-avatar-circle">U</div>
            <span style="font-size: 0.85rem; color: var(--text-secondary);">Camera Turned Off</span>
          </div>

          <!-- Quick Toggle Bar -->
          <div class="preview-controls-overlay">
            <button id="preview-toggle-mic" class="control-btn active" title="Toggle Microphone">
              <i class="fa-solid fa-microphone"></i>
            </button>
            <button id="preview-toggle-video" class="control-btn active" title="Toggle Camera">
              <i class="fa-solid fa-video"></i>
            </button>
          </div>
        </div>

        <!-- Right: Join / Create Room Panel -->
        <div class="lobby-action-card">
          
          <!-- User Profile Meta -->
          <div class="user-profile-header">
            <div class="user-profile-meta">
              <div class="lobby-avatar-container" title="Click to upload or change profile photo">
                <div class="mini-avatar" id="lobby-user-avatar">U</div>
                <div class="avatar-change-badge"><i class="fa-solid fa-camera"></i></div>
                <input type="file" id="lobby-avatar-input" accept="image/jpeg,image/png,image/webp,image/gif" style="display: none;">
              </div>
              <div class="participant-name-group">
                <span class="participant-name" id="lobby-username-display">Loading...</span>
                <span class="participant-tag" id="lobby-email-display">user@domain.com</span>
              </div>
            </div>
            <span class="room-info-badge">Verified JWT</span>
          </div>

          <!-- Join Form -->
          <form id="join-room-form">
            <div class="form-group">
              <label class="form-label" for="room-id-input">Room Code / URL</label>
              <input 
                type="text" 
                id="room-id-input" 
                class="form-input" 
                placeholder="e.g. alpha-room or nexus-842" 
                value="nexus-alpha"
                required
              >
            </div>

            <div style="margin-top: 0.85rem;">
              <button type="submit" class="btn-join-room">
                <span>Enter Conference Room</span>
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </form>

          <div class="quick-actions-row">
            <button id="btn-generate-instant-room" class="btn-quick-create">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>Generate Instant Code</span>
            </button>
          </div>

          <div style="font-size: 0.72rem; color: var(--text-muted); text-align: center;">
            Encrypted WebRTC P2P mesh will establish upon room entrance.
          </div>

        </div>

      </div>
    </main>
  </div>

  <script src="error-manager.js"></script>
  <script src="auth-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Guard Check
      const user = await requireAuth();
      if (!user) return;

      // Helper function to render user avatar with initials fallback
      function renderUserAvatar(avatarUrl, username) {
        const initials = (username || 'U').substring(0, 2).toUpperCase();
        const lobbyAvatarEl = document.getElementById('lobby-user-avatar');
        const previewAvatarEl = document.getElementById('preview-avatar-circle');

        if (avatarUrl) {
          lobbyAvatarEl.innerHTML = `<img src="${avatarUrl}" alt="${username || 'User'}" class="mini-avatar-img" onerror="this.style.display='none'; this.parentElement.textContent='${initials}';">`;
          previewAvatarEl.innerHTML = `<img src="${avatarUrl}" alt="${username || 'User'}" class="preview-avatar-img" onerror="this.style.display='none'; this.parentElement.textContent='${initials}';">`;
        } else {
          lobbyAvatarEl.textContent = initials;
          previewAvatarEl.textContent = initials;
        }
      }

      // Update User Profile Displays
      document.getElementById('lobby-username-display').textContent = user.username;
      document.getElementById('lobby-email-display').textContent = user.email;
      renderUserAvatar(user.avatarUrl, user.username);

      // Lobby Avatar Upload / Change Handler
      const avatarContainer = document.querySelector('.lobby-avatar-container');
      const avatarInput = document.getElementById('lobby-avatar-input');
      if (avatarContainer && avatarInput) {
        avatarContainer.addEventListener('click', () => avatarInput.click());
        avatarInput.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          if (file.size > 5 * 1024 * 1024) {
            alert('Avatar image must be smaller than 5MB');
            return;
          }
          const reader = new FileReader();
          reader.onload = async (ev) => {
            const dataUrl = ev.target.result;
            try {
              const res = await apiUploadAvatar(dataUrl);
              if (res && res.avatarUrl) {
                user.avatarUrl = res.avatarUrl;
                renderUserAvatar(res.avatarUrl, user.username);
              }
            } catch (err) {
              console.error('Failed to upload avatar:', err);
              alert(err.message || 'Failed to upload profile image');
            }
          };
          reader.readAsDataURL(file);
        });
      }

      // 2. Camera / Mic Preview Acquisition
      let previewStream = null;
      let micEnabled = true;
      let videoEnabled = true;

      const videoEl = document.getElementById('preview-video-stream');
      const placeholderEl = document.getElementById('preview-avatar-placeholder');
      const micBtn = document.getElementById('preview-toggle-mic');
      const videoBtn = document.getElementById('preview-toggle-video');

      try {
        previewStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });
        videoEl.srcObject = previewStream;
        placeholderEl.classList.add('hidden');
      } catch (err) {
        try {
          previewStream = await navigator.mediaDevices.getUserMedia({ video: true });
          videoEl.srcObject = previewStream;
          placeholderEl.classList.add('hidden');
        } catch (e1) {
          console.warn('Media preview unavailable:', err);
          placeholderEl.classList.remove('hidden');
        }
      }

      // Mic Preview Toggle
      micBtn.addEventListener('click', () => {
        micEnabled = !micEnabled;
        if (previewStream && previewStream.getAudioTracks().length > 0) {
          previewStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
        }
        micBtn.className = `control-btn ${micEnabled ? 'active' : 'muted'}`;
        micBtn.innerHTML = `<i class="fa-solid ${micEnabled ? 'fa-microphone' : 'fa-microphone-slash'}"></i>`;
      });

      // Video Preview Toggle
      videoBtn.addEventListener('click', () => {
        videoEnabled = !videoEnabled;
        if (previewStream && previewStream.getVideoTracks().length > 0) {
          previewStream.getVideoTracks().forEach(t => t.enabled = videoEnabled);
        }
        videoBtn.className = `control-btn ${videoEnabled ? 'active' : 'off'}`;
        videoBtn.innerHTML = `<i class="fa-solid ${videoEnabled ? 'fa-video' : 'fa-video-slash'}"></i>`;
        
        if (videoEnabled && previewStream && previewStream.getVideoTracks().length > 0) {
          placeholderEl.classList.add('hidden');
        } else {
          placeholderEl.classList.remove('hidden');
        }
      });

      // 3. Instant Room Code Generator
      document.getElementById('btn-generate-instant-room').addEventListener('click', () => {
        const randomCode = `nexus-${Math.floor(1000 + Math.random() * 9000)}`;
        document.getElementById('room-id-input').value = randomCode;
      });

      // 4. Join Room Action
      function navigateToRoom() {
        const inputEl = document.getElementById('room-id-input');
        const rawVal = (inputEl && inputEl.value.trim()) ? inputEl.value.trim() : 'nexus-alpha';
        let roomId = rawVal;
        let hash = '';

        if (rawVal.includes('/room') || rawVal.includes('?room=')) {
          try {
            const parsed = new URL(rawVal, window.location.origin);
            roomId = parsed.searchParams.get('room') || 'nexus-alpha';
            hash = parsed.hash || '';
          } catch (_) {}
        } else if (rawVal.includes('#')) {
          const parts = rawVal.split('#');
          roomId = parts[0];
          hash = '#' + parts[1];
        }

        sessionStorage.setItem('nexus_initial_mic', micEnabled ? 'true' : 'false');
        sessionStorage.setItem('nexus_initial_video', videoEnabled ? 'true' : 'false');

        if (previewStream) {
          previewStream.getTracks().forEach(t => t.stop());
        }

        window.location.href = `/room?room=${encodeURIComponent(roomId)}${hash}`;
      }

      const joinBtn = document.querySelector('.btn-join-room');
      if (joinBtn) {
        joinBtn.addEventListener('click', (e) => {
          e.preventDefault();
          navigateToRoom();
        });
      }

      const joinForm = document.getElementById('join-room-form');
      if (joinForm) {
        joinForm.addEventListener('submit', (e) => {
          e.preventDefault();
          navigateToRoom();
        });
      }

      // 5. Logout
      document.getElementById('btn-logout').addEventListener('click', () => {
        if (confirm('Are you sure you want to sign out?')) {
          if (previewStream) {
            previewStream.getTracks().forEach(t => t.stop());
          }
          clearAuthSession();
          window.location.href = '/login';
        }
      });
    });
  </script>
</body>
</html>
